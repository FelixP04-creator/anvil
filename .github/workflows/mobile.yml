# Builds the mobile apps for a release tag (v*).
#
#   Android → debug APK (installable directly; enable "install unknown apps")
#   iOS     → unsigned IPA (sideload with AltStore / SideSync / TrollStore —
#             Apple requires a paid developer account for an App Store build)
name: mobile

on:
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile tooling
        working-directory: mobile
        run: npm ci

      - name: Sync web assets
        working-directory: mobile
        run: npm run sync-web && npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        working-directory: mobile/android/app/build/outputs/apk/debug
        run: mv app-debug.apk "anvil-mobile-${GITHUB_REF_NAME#v}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anvil-mobile-android
          path: mobile/android/app/build/outputs/apk/debug/anvil-mobile-*.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd mobile/android/app/build/outputs/apk/debug
          gh release upload "${{ github.ref_name }}" \
            "anvil-mobile-${GITHUB_REF_NAME#v}-debug.apk" \
            --clobber --repo "${{ github.repository }}"

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile tooling
        working-directory: mobile
        run: npm ci

      - name: Sync web assets
        working-directory: mobile
        run: npm run sync-web && npx cap sync ios

      - name: Build archive (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -project App/App.xcodeproj -scheme App \
            -configuration Release -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath build/anvil.xcarchive

      - name: Package unsigned IPA
        working-directory: mobile/ios
        run: |
          # xcodebuild -exportArchive wants a team even for ad-hoc; an
          # unsigned IPA is just a zip of Payload/App.app, and sideloaders
          # (AltStore, SideSync) re-sign it for the device anyway.
          mkdir -p build/unsigned/Payload
          cp -R build/anvil.xcarchive/Products/Applications/App.app build/unsigned/Payload/
          (cd build/unsigned && zip -qr "anvil-mobile-${GITHUB_REF_NAME#v}-unsigned.ipa" Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: anvil-mobile-ios
          path: mobile/ios/build/unsigned/*.ipa

      - name: Attach IPA to the release
        if: startsWith(github.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            mobile/ios/build/unsigned/*.ipa \
            --clobber --repo "${{ github.repository }}"
