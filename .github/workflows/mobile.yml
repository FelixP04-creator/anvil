# Builds the mobile apps for a release tag (v*).
#
#   Android → debug APK (installable directly; enable "install unknown apps")
#   iOS     → unsigned IPA (sideload with AltStore / SideSync / TrollStore —
#             Apple requires a paid developer account for an App Store build)
name: mobile

on:
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install mobile tooling
        working-directory: mobile
        run: npm ci

      - name: Sync web assets
        working-directory: mobile
        run: npm run sync-web && npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anvil-mobile-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber --repo "${{ github.repository }}"

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile tooling
        working-directory: mobile
        run: npm ci

      - name: Sync web assets
        working-directory: mobile
        run: npm run sync-web && npx cap sync ios

      - name: Build archive (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -workspace App/App.xcworkspace -scheme App \
            -configuration Release -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive -archivePath build/anvil.xcarchive

      - name: Export unsigned IPA
        working-directory: mobile/ios
        run: |
          cat > export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string></string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/anvil.xcarchive \
            -exportOptionsPlist export.plist -exportPath build/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: anvil-mobile-ios
          path: mobile/ios/build/export/*.ipa

      - name: Attach IPA to the release
        if: startsWith(github.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            mobile/ios/build/export/*.ipa \
            --clobber --repo "${{ github.repository }}"
