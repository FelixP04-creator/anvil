<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>anvil</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='4' width='12' height='3' rx='1' fill='%23f0a840'/%3E%3Crect x='5.5' y='7' width='5' height='3' fill='%23f0a840'/%3E%3Crect x='3' y='10' width='10' height='3' rx='1.5' fill='%236ea8fe'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <div id="backdrop"></div>

    <aside id="sidebar">
      <div class="side-head">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2.8 4.4c.3-.3.8-.4 1.2-.4h12.3c1.6 0 3.1.5 4.3 1.4.5.3.6 1 .2 1.5l-.8 1c-1 1.2-2.4 2-4 2.4v2.1c0 .7-.5 1.2-1.2 1.2h-1.3v2.6c1.7.4 3 1.5 3.6 3.2.2.6-.2 1.2-.9 1.2H5.6c-.7 0-1.1-.6-.9-1.2.6-1.7 1.9-2.8 3.6-3.2v-2.6H7c-.7 0-1.2-.5-1.2-1.2v-2.1c-1.7-.5-3.2-1.6-4.3-3.1-.3-.5-.2-1.2.3-1.8z"/>
          </svg>
          <span class="brand-name">anvil</span>
        </div>
        <button id="theme-toggle" class="icon-btn" title="Toggle light / dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
      </div>

      <button id="new-session">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New session</span>
        <kbd class="side-kbd">N</kbd>
      </button>

      <nav id="session-list" aria-label="Sessions"></nav>

      <section id="todo-panel">
        <div class="todo-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 5.5 8 8 5"/><path d="M4 12.5 5.5 14 8 11"/><path d="M11 7h9M11 13h9M11 19h9M4 19h.01"/></svg>
          <span>Tasks</span>
          <span id="todo-count"></span>
        </div>
        <ul id="todo-list"></ul>
      </section>

      <div class="side-foot">
        <span id="side-version"></span>
        <span>MIT · zero deps</span>
      </div>
    </aside>

    <div id="main">
      <header id="topbar">
        <button id="menu-btn" class="icon-btn" title="Sessions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="session-title">…</div>
        <div class="topbar-right">
          <select id="mode" title="Permission mode">
            <option value="default">default</option>
            <option value="acceptEdits">accept edits</option>
            <option value="plan">plan</option>
            <option value="bypass">bypass</option>
          </select>
          <select id="model" title="Model — change applies from the next message"></select>
          <span id="cwd" class="pill mono" title="Working directory">…</span>
          <button id="settings-btn" class="icon-btn" title="Settings (provider, keys, model, thinking)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.58 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.86a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08A1.7 1.7 0 0 0 10.12 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.88z"/></svg>
          </button>
          <button id="copy-link" class="icon-btn" title="Copy session link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.6-5.6l-1.7 1.7"/><path d="M14 10a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.6 5.6l1.7-1.7"/></svg>
          </button>
        </div>
      </header>

      <main id="scroller">
        <div id="messages" class="col">
          <div id="empty" class="empty">
            <svg class="empty-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M2.8 4.4c.3-.3.8-.4 1.2-.4h12.3c1.6 0 3.1.5 4.3 1.4.5.3.6 1 .2 1.5l-.8 1c-1 1.2-2.4 2-4 2.4v2.1c0 .7-.5 1.2-1.2 1.2h-1.3v2.6c1.7.4 3 1.5 3.6 3.2.2.6-.2 1.2-.9 1.2H5.6c-.7 0-1.1-.6-.9-1.2.6-1.7 1.9-2.8 3.6-3.2v-2.6H7c-.7 0-1.2-.5-1.2-1.2v-2.1c-1.7-.5-3.2-1.6-4.3-3.1-.3-.5-.2-1.2.3-1.8z"/>
            </svg>
            <div class="empty-title">What should we build?</div>
            <div class="empty-sub">
              anvil reads, edits, and runs commands in
              <span class="mono" id="empty-cwd">the current directory</span>.
            </div>
            <div class="empty-suggest">
              <button type="button">Explain this project's layout</button>
              <button type="button">Find all TODO comments in src/</button>
              <button type="button">Write a unit test for the agent loop</button>
              <button type="button">Refactor the largest file for clarity</button>
            </div>
          </div>
        </div>
        <button id="jump" type="button" hidden>↓&nbsp;latest</button>
      </main>

      <footer id="composer">
        <div class="status-row">
          <span id="status" class="status"><span class="status-dot"></span><span id="status-text">idle</span></span>
          <span id="tokens"></span>
        </div>
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Describe a task…"></textarea>
          <button id="send" title="Send (Enter)">
            <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12 20 4l-4 8 4 8-16-8z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
        <div class="composer-hint">
          <span><kbd>Enter</kbd> send</span>
          <span><kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
          <span><kbd>Esc</kbd> stop</span>
        </div>
      </footer>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <div id="settings-backdrop" hidden></div>
  <div id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="set-head">
      <span id="settings-title">Settings</span>
      <button id="settings-close" class="icon-btn" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="set-body">
      <label class="set-field">
        <span>Provider</span>
        <select id="set-provider">
          <option value="">auto (first key found)</option>
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="hsnr">HSNR (ai.ide3.de)</option>
        </select>
      </label>
      <label class="set-field">
        <span>Anthropic API key</span>
        <input id="set-anthropic-key" type="password" placeholder="sk-ant-…" autocomplete="off" spellcheck="false">
      </label>
      <label class="set-field">
        <span>OpenAI API key</span>
        <input id="set-openai-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
      </label>
      <label class="set-field">
        <span>OpenAI base URL (optional)</span>
        <input id="set-openai-base" type="text" placeholder="https://api.openai.com/v1" spellcheck="false">
      </label>
      <label class="set-field" id="hsnr-fields-key" hidden>
        <span>HSNR API key</span>
        <input id="set-hsnr-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
      </label>
      <label class="set-field" id="hsnr-fields-base" hidden>
        <span>HSNR base URL (optional)</span>
        <input id="set-hsnr-base" type="text" placeholder="https://ai.ide3.de/openai" spellcheck="false">
      </label>
      <label class="set-field">
        <span>Model</span>
        <input id="set-model" type="text" list="model-options" placeholder="default for the provider" spellcheck="false">
      </label>
      <datalist id="model-options"></datalist>
      <label class="set-field">
        <span>Thinking effort</span>
        <select id="set-thinking">
          <option value="off">off</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </label>
    </div>
    <div class="set-foot">
      <span class="set-note">Applies to new sessions. Keys are stored in <span class="mono" id="set-config-path">~/.anvil.json</span>.</span>
      <button id="set-save" type="button">Save</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
